# Restart Jekyll after changing this file.
locale: "en-US"
site_theme: "default"
title: "Chuck Noah's Site"
title_separator: "-"
name: "Noah Moran"
description: "Noah Moran's research in theoretical physics and machine learning."
url: "https://chucknoah.github.io"
baseurl: ""
repository: "chucknoah/chucknoah.github.io"

author:
  avatar: "face_pic.jpg"
  name: " Noah Moran"
  employer: "UCLA"
  email: "chucknoah@ucla.edu"
  googlescholar: "https://scholar.google.com/citations?user=O3jLegUAAAAJ&hl=en&oi=ao"
  inspire-hep: "https://inspirehep.net/authors/2870912?ui-citation-summary=true"
  github: "chucknoah"

publication_category:
  manuscripts:
    title: "Journal Articles"

breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
atom_feed:
  hide: true

include:
  - .htaccess
  - _pages
exclude:
  - .bundle
  - .github
  - .devcontainer
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json*
  - README.md
  - tmp
  - vendor
encoding: "utf-8"

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-redirect-from
whitelist:
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
